<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEOツールの導入率（Ramp集計）</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7b7a74;
    --grid: #e7e6e1;
    --axis: #c9c8c1;
    --series-1: #2a78d6;  /* Profound */
    --series-2: #eb6834;  /* Peec AI */
    --series-3: #1baf7a;  /* AirOps */
    --series-4: #eda100;  /* Clearscope */
    --series-other: #a3a29a;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", "Noto Sans CJK JP", Meiryo, sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    max-width: 760px;
    margin: 0 auto;
    padding: 4px 2px 8px;
  }
  html, body { margin: 0; background: #ffffff; }
  .viz-title { font-size: 17px; font-weight: 700; margin: 0 0 4px; line-height: 1.4; }
  .viz-sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px; line-height: 1.5; }
  .viz-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--text-secondary); margin: 0 0 6px; padding: 0; list-style: none; }
  .viz-legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 0; }
  .viz-legend input { margin: 0; width: 14px; height: 14px; accent-color: #52514e; cursor: pointer; }
  .viz-legend .key { display: inline-block; width: 18px; height: 0; border-top: 2px solid; }
  .viz-plot { position: relative; }
  .viz-plot svg { display: block; width: 100%; height: auto; outline: none; }
  .viz-plot svg:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .viz-tip {
    position: absolute; pointer-events: none; display: none;
    background: #ffffff; border: 1px solid var(--axis); border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.10);
    padding: 8px 10px; font-size: 12.5px; line-height: 1.5; min-width: 150px; z-index: 2;
  }
  .viz-tip .tip-head { color: var(--text-secondary); margin-bottom: 4px; }
  .viz-tip .tip-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .viz-tip .tip-key { display: inline-block; width: 12px; height: 0; border-top: 2px solid; flex: none; }
  .viz-tip .tip-val { font-weight: 700; color: var(--text-primary); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .viz-tip .tip-name { color: var(--text-secondary); }
  .viz-source { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; line-height: 1.6; }
  .viz-source a { color: inherit; }
  details.viz-table { margin-top: 8px; font-size: 12.5px; }
  details.viz-table summary { cursor: pointer; color: var(--text-secondary); }
  .viz-table-wrap { overflow-x: auto; margin-top: 6px; }
  .viz-table table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .viz-table th, .viz-table td { border-bottom: 1px solid var(--grid); padding: 4px 8px; text-align: right; white-space: nowrap; }
  .viz-table th:first-child, .viz-table td:first-child { text-align: left; }
  .viz-table th { color: var(--text-secondary); font-weight: 600; }
</style>
</head>
<body>
<div class="viz-root">
  <p class="viz-title">AEOツールの導入率（Ramp集計）</p>
  <p class="viz-sub">単位は%。過去12か月にAEOツールを購入した米国企業のうち、各ベンダーに支払った企業の割合。出典：Ramp「AEO software」公開データ（2026年9月分まで）</p>
  <ul class="viz-legend" id="legend" aria-label="凡例"></ul>
  <div class="viz-plot" id="plot">
    <svg id="chart" role="img" tabindex="0" aria-label="AEOツール各社の導入率の推移。Profoundは2025年3月の2.4%から2026年4月に52.1%まで上昇し、以降は52%台で横ばい。左右の矢印キーで月を移動できます。"></svg>
    <div class="viz-tip" id="tip" role="status" aria-live="polite"></div>
  </div>
  <p class="viz-source">2026年11月10日時点のRampの公開データをもとに筆者作成。複数のツールを併用する企業があるため、各社の合計は100%を超えます。凡例のチェックで表示する会社を選べます。</p>
  <details class="viz-table">
    <summary>データを表で見る</summary>
    <div class="viz-table-wrap"><table id="table"></table></div>
  </details>
</div>

<script>
(function () {
  "use strict";
  var MONTHS = ["2024-10","2024-11","2024-12","2025-01","2025-02","2025-03","2025-04","2025-05","2025-06","2025-07","2025-08","2025-09","2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09"];
  var N = null;
  var SERIES = [
    { name: "Profound",   color: "var(--series-1)", main: true,
      v: [N,N,N,N,N,2.4,5.1095,10.6667,18.7845,27.2727,36.1314,39.1167,41.691,45.7801,48.1567,49.0566,50.7299,51.2356,52.0674,52.4476,52.7273,52.439,52.3973,52.8899] },
    { name: "Peec AI",    color: "var(--series-2)", main: true,
      v: [N,N,N,N,N,4.0,5.8394,6.6667,8.2873,10.0,10.9489,11.6719,12.2449,12.7877,13.3641,14.4654,14.4161,14.827,15.1608,16.6434,16.7532,17.6829,18.379,19.3021] },
    { name: "AirOps",     color: "var(--series-3)", main: true,
      v: [20.9524,24.1071,27.4336,29.7297,29.4118,28.8,29.927,29.3333,26.5193,24.5455,21.8978,20.5047,19.5335,18.1586,17.2811,17.4004,17.1533,17.6277,17.7642,17.4825,17.2727,17.439,17.1233,16.9029] },
    { name: "Clearscope", color: "var(--series-4)", main: true,
      v: [80.0,76.7857,73.4513,72.0721,70.5882,65.6,61.3139,56.6667,46.9613,37.7273,30.292,25.8675,24.4898,21.2276,18.894,16.9811,15.6934,14.827,13.7825,12.4476,12.0779,11.3415,10.5023,10.2508] },
    { name: "Scrunch AI", color: "var(--series-other)", main: false,
      v: [N,N,N,N,N,4.0,5.1095,6.0,9.3923,10.4545,10.219,9.1483,9.3294,9.7187,9.447,9.434,9.4891,9.3904,9.0352,9.3706,9.4805,9.5122,9.1324,8.615] },
    { name: "Athena HQ",  color: "var(--series-other)", main: false,
      v: [N,N,N,N,N,N,N,N,N,N,N,5.3628,5.8309,5.1151,4.6083,5.0314,4.927,4.7776,4.7473,4.7552,4.8052,4.5122,4.4521,4.5802] }
  ];
  var Y_MAX = 85, Y_TICKS = [0, 20, 40, 60, 80];
  var svg = document.getElementById("chart");
  var plot = document.getElementById("plot");
  var tip = document.getElementById("tip");
  var NS = "http://www.w3.org/2000/svg";
  var state = { idx: null, geom: null };

  function el(name, attrs, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(v) { return v.toFixed(1) + "%"; }
  function monthLabel(m, withYear) {
    var p = m.split("-");
    return (withYear ? p[0] + "年" : "") + parseInt(p[1], 10) + "月";
  }

  function buildLegend() {
    var ul = document.getElementById("legend");
    SERIES.forEach(function (s) {
      var li = document.createElement("li");
      var label = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = true;
      cb.addEventListener("change", function () { s.hidden = !cb.checked; hide(); draw(); });
      var key = document.createElement("span");
      key.className = "key";
      key.style.borderTopColor = s.color;
      var name = document.createElement("span");
      name.textContent = s.name;
      label.appendChild(cb); label.appendChild(key); label.appendChild(name);
      li.appendChild(label);
      ul.appendChild(li);
    });
  }

  function buildTable() {
    var t = document.getElementById("table");
    var thead = document.createElement("thead"), tr = document.createElement("tr");
    var th0 = document.createElement("th"); th0.textContent = "月"; tr.appendChild(th0);
    SERIES.forEach(function (s) { var th = document.createElement("th"); th.textContent = s.name; tr.appendChild(th); });
    thead.appendChild(tr); t.appendChild(thead);
    var tb = document.createElement("tbody");
    MONTHS.forEach(function (m, i) {
      var r = document.createElement("tr");
      var td0 = document.createElement("td"); td0.textContent = monthLabel(m, true); r.appendChild(td0);
      SERIES.forEach(function (s) {
        var td = document.createElement("td");
        td.textContent = s.v[i] == null ? "—" : fmt(s.v[i]);
        r.appendChild(td);
      });
      tb.appendChild(r);
    });
    t.appendChild(tb);
  }

  function draw() {
    var W = Math.max(320, Math.round(plot.clientWidth));
    var narrow = W < 520;
    var H = narrow ? 340 : 400;
    var m = { top: 12, right: narrow ? 124 : 132, bottom: 34, left: 38 };
    var iw = W - m.left - m.right, ih = H - m.top - m.bottom;
    var x = function (i) { return m.left + iw * i / (MONTHS.length - 1); };
    var y = function (v) { return m.top + ih * (1 - v / Y_MAX); };
    state.geom = { W: W, H: H, m: m, iw: iw, ih: ih, x: x, y: y };

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W); svg.setAttribute("height", H);

    // grid + y labels
    Y_TICKS.forEach(function (t) {
      svg.appendChild(el("line", { x1: m.left, x2: m.left + iw, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: m.left - 8, y: y(t) + 4, "text-anchor": "end", "font-size": 11.5, fill: "var(--text-muted)" }, t + (t === 80 ? "%" : "")));
    });
    // x labels: quarterly
    MONTHS.forEach(function (mm, i) {
      var mo = parseInt(mm.split("-")[1], 10);
      var show = narrow ? (mo === 1 || mo === 7) : (mo === 1 || mo === 4 || mo === 7 || mo === 10);
      if (!show) return;
      var withYear = (i === 0 || mo === 1);
      svg.appendChild(el("line", { x1: x(i), x2: x(i), y1: m.top + ih, y2: m.top + ih + 4, stroke: "var(--axis)", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: x(i), y: m.top + ih + 18, "text-anchor": i === 0 ? "start" : "middle", "font-size": 11.5, fill: "var(--text-muted)" }, monthLabel(mm, false)));
      if (withYear) svg.appendChild(el("text", { x: x(i), y: m.top + ih + 31, "text-anchor": i === 0 ? "start" : "middle", "font-size": 11, fill: "var(--text-muted)" }, mm.split("-")[0] + "年"));
    });

    // crosshair (under lines)
    var cross = el("line", { id: "cross", y1: m.top, y2: m.top + ih, stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" });
    svg.appendChild(cross);

    // lines: secondary first so main series sit on top
    var VIS = SERIES.filter(function (s) { return !s.hidden; });
    var order = VIS.filter(function (s) { return !s.main; }).concat(VIS.filter(function (s) { return s.main; }).reverse());
    order.forEach(function (s) {
      var d = "", started = false;
      s.v.forEach(function (v, i) {
        if (v == null) return;
        d += (started ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
        started = true;
      });
      svg.appendChild(el("path", { d: d, fill: "none", stroke: s.color, "stroke-width": s.main ? 2 : 1.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    });

    // end markers + direct labels with collision dodge
    var last = MONTHS.length - 1;
    var labels = VIS.map(function (s) { return { s: s, yv: y(s.v[last]), yl: y(s.v[last]) }; })
      .sort(function (a, b) { return a.yl - b.yl; });
    var GAP = 15;
    for (var pass = 0; pass < 8; pass++) {
      for (var i = 1; i < labels.length; i++) {
        var d = labels[i].yl - labels[i - 1].yl;
        if (d < GAP) { var sh = (GAP - d) / 2; labels[i - 1].yl -= sh; labels[i].yl += sh; }
      }
    }
    var maxY = m.top + ih - 2;
    for (var j = labels.length - 1; j >= 0; j--) {
      if (labels[j].yl > maxY) labels[j].yl = maxY;
      maxY = labels[j].yl - GAP;
    }
    labels.forEach(function (L) {
      var s = L.s;
      svg.appendChild(el("circle", { cx: x(last), cy: L.yv, r: s.main ? 4 : 3, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 2 }));
      if (Math.abs(L.yl - L.yv) > 3) {
        svg.appendChild(el("line", { x1: x(last) + 6, y1: L.yv, x2: x(last) + 11, y2: L.yl, stroke: "var(--axis)", "stroke-width": 1 }));
      }
      var t = el("text", { x: x(last) + 13, y: L.yl + 4, "font-size": narrow ? 11.5 : 12, fill: s.main ? "var(--text-primary)" : "var(--text-muted)" });
      var name = el("tspan", { "font-weight": s.main ? 600 : 400 }, s.name + " ");
      var val = el("tspan", {}, fmt(s.v[last]));
      t.appendChild(name); t.appendChild(val);
      svg.appendChild(t);
    });

    // hover dots layer
    var dots = el("g", { id: "dots", visibility: "hidden" });
    SERIES.forEach(function (s, si) {
      dots.appendChild(el("circle", { "data-si": si, r: 4, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 2 }));
    });
    svg.appendChild(dots);

    // hit area
    var hit = el("rect", { x: m.left, y: m.top, width: iw, height: ih + m.bottom, fill: "transparent" });
    svg.appendChild(hit);
    if (state.idx != null) show(state.idx);
  }

  function show(i) {
    var g = state.geom; if (!g) return;
    state.idx = i;
    var cx = g.x(i);
    var cross = svg.querySelector("#cross");
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    var dots = svg.querySelector("#dots"); dots.setAttribute("visibility", "visible");
    Array.prototype.forEach.call(dots.children, function (c) {
      var s = SERIES[+c.getAttribute("data-si")], v = s.v[i];
      if (v == null || s.hidden) { c.setAttribute("visibility", "hidden"); return; }
      c.setAttribute("visibility", "inherit"); c.setAttribute("cx", cx); c.setAttribute("cy", g.y(v));
    });
    while (tip.firstChild) tip.removeChild(tip.firstChild);
    var head = document.createElement("div"); head.className = "tip-head"; head.textContent = monthLabel(MONTHS[i], true);
    tip.appendChild(head);
    SERIES.filter(function (s) { return s.v[i] != null && !s.hidden; })
      .sort(function (a, b) { return b.v[i] - a.v[i]; })
      .forEach(function (s) {
        var row = document.createElement("div"); row.className = "tip-row";
        var key = document.createElement("span"); key.className = "tip-key"; key.style.borderTopColor = s.color;
        var val = document.createElement("span"); val.className = "tip-val"; val.textContent = fmt(s.v[i]);
        var name = document.createElement("span"); name.className = "tip-name"; name.textContent = s.name;
        row.appendChild(key); row.appendChild(val); row.appendChild(name);
        tip.appendChild(row);
      });
    tip.style.display = "block";
    var tw = tip.offsetWidth, left = cx + 12;
    if (left + tw > g.W - 4) left = cx - 12 - tw;
    if (left < 0) left = 0;
    tip.style.left = left + "px";
    tip.style.top = (g.m.top + 6) + "px";
  }
  function hide() {
    state.idx = null;
    var cross = svg.querySelector("#cross"), dots = svg.querySelector("#dots");
    if (cross) cross.setAttribute("visibility", "hidden");
    if (dots) dots.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  }
  function idxFromEvent(e) {
    var g = state.geom, r = svg.getBoundingClientRect();
    var px = (e.clientX - r.left) * (g.W / r.width);
    var i = Math.round((px - g.m.left) / g.iw * (MONTHS.length - 1));
    return Math.max(0, Math.min(MONTHS.length - 1, i));
  }
  svg.addEventListener("pointermove", function (e) { show(idxFromEvent(e)); });
  svg.addEventListener("pointerdown", function (e) { show(idxFromEvent(e)); });
  svg.addEventListener("pointerleave", function () { if (document.activeElement !== svg) hide(); });
  svg.addEventListener("focus", function () { if (state.idx == null) show(MONTHS.length - 1); });
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", function (e) {
    var i = state.idx == null ? MONTHS.length - 1 : state.idx;
    if (e.key === "ArrowLeft") { show(Math.max(0, i - 1)); e.preventDefault(); }
    else if (e.key === "ArrowRight") { show(Math.min(MONTHS.length - 1, i + 1)); e.preventDefault(); }
    else if (e.key === "Home") { show(0); e.preventDefault(); }
    else if (e.key === "End") { show(MONTHS.length - 1); e.preventDefault(); }
    else if (e.key === "Escape") { hide(); }
  });

  buildLegend(); buildTable(); draw();
  var raf = null;
  if (window.ResizeObserver) new ResizeObserver(function () {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(draw);
  }).observe(plot);
  else window.addEventListener("resize", draw);
})();
</script>
</body>
</html>
